<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title }}</title>
</head>

<body style="margin:0;padding:0;background-color:#f4f6f8;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0"
    style="background-color:#f4f6f8;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0"
          style="max-width:600px;width:100%;background-color:#ffffff;border-radius:8px;overflow:hidden;border:1px solid #e5e7eb;">
          <tr>
            <td style="background-color:#0f4c81;padding:20px 24px;color:#ffffff;">
              <div style="font-size:13px;letter-spacing:0.5px;text-transform:uppercase;opacity:0.85;">ProjektLabor
                Futárszolgálat</div>
              <h1 style="margin:6px 0 0;font-size:20px;line-height:1.3;">{{ title }}</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:24px;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td
              style="background-color:#f9fafb;padding:16px 24px;border-top:1px solid #e5e7eb;font-size:12px;color:#6b7280;">
              Ez egy automatikusan generált értesítés a ProjektLab csomagkezelő rendszerből. Kérjük, ne válaszolj erre
              az üzenetre.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>

</html>
